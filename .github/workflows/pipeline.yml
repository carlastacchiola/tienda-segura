
name: pipeline

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Analizar dependencias con npm audit
        run: npm audit --audit-level=high

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Analizar código con Semgrep
        run: semgrep scan --config auto --error --exclude-rule javascript.express.security.audit.express-check-csurf-middleware-usage.express-check-csurf-middleware-usage

      - name: Detectar secretos con Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Iniciar aplicación para análisis dinámico
        run: |
          node app.js &
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/salud; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Analizar aplicación con OWASP ZAP
        run: |
          docker run --rm --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:3000 \
            -I